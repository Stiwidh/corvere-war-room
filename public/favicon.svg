<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="War Room">
  <!--
    Un pulpo del mapa: la cabeza es la sesión y los tres nodos que cuelgan son
    sus agentes. Nada más. A 16 px, que es el tamaño que de verdad importa, solo
    sobrevive lo gordo: por eso no hay arco de mensaje lateral ni cables finos,
    que a ese tamaño se convertían en suciedad.

    El punto de abajo a la derecha es el estado de la flota: `app.js` le cambia
    el relleno al vuelo, así que el icono avisa desde la pestaña sin tener que
    mirar el panel. Lo busca por su id, "estado", que no se puede renombrar sin
    tocar también pintarFavicon().
  -->
  <defs>
    <linearGradient id="cabeza" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9810FA"/>
      <stop offset="1" stop-color="#E60076"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="#111114"/>

  <!-- los cables, gruesos a propósito: a 16 px son lo único que ata el dibujo -->
  <g stroke="#9810FA" stroke-width="5" stroke-linecap="round">
    <line x1="29" y1="33" x2="15" y2="16"/>
    <line x1="29" y1="33" x2="48" y2="15"/>
    <line x1="29" y1="33" x2="15" y2="51"/>
  </g>

  <circle cx="29" cy="33" r="14" fill="url(#cabeza)"/>

  <circle cx="15" cy="16" r="7" fill="#00E68C"/>
  <circle cx="48" cy="15" r="7" fill="#c084fc"/>
  <circle cx="15" cy="51" r="7" fill="#E60076"/>

  <!-- estado de la flota, aislado en su esquina para que no se mezcle con nada -->
  <circle id="estado" cx="50" cy="48" r="11" fill="#5A5766" stroke="#111114" stroke-width="5"/>
</svg>

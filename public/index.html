<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Corvere War Room</title>
<link id="favicon" rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  :root{
    --void:#111114; --void-2:#16161b; --surf:#1a1a1f; --surf-2:#202027;
    --line:#26262f; --line-soft:#1f1f27;
    --txt:#F8FAFC; --txt-2:#A9A6B4; --txt-3:#6E6B7A; --dim:#4c4956;
    --accent:#9810FA; --accent-2:#E60076; --accent-soft:#c084fc;
    --ok:#00E68C; --warn:#FFB547; --err:#EF5350; --idle:#5A5766;
    --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
    --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--void); color:var(--txt);
    font-family:var(--sans); font-size:14px; line-height:1.45;
    background-image:linear-gradient(var(--line-soft) 1px,transparent 1px),
                     linear-gradient(90deg,var(--line-soft) 1px,transparent 1px);
    background-size:46px 46px;
  }
  .shell{max-width:1900px; margin:0 auto; padding:12px 16px 20px; display:flex; flex-direction:column; gap:12px}
  .mono{font-family:var(--mono)} .tnum{font-variant-numeric:tabular-nums}

  .bar{display:flex; align-items:center; gap:16px; flex-wrap:wrap;
    background:linear-gradient(180deg,var(--surf),var(--void-2));
    border:1px solid var(--line); border-radius:10px; padding:10px 16px}
  .brand h1{margin:0; font-size:15px; font-weight:800; letter-spacing:.16em; text-transform:uppercase;
    background:linear-gradient(90deg,var(--accent-soft),var(--accent-2));
    -webkit-background-clip:text; background-clip:text; color:transparent}
  .brand .sub{font-family:var(--mono); font-size:10.5px; color:var(--txt-3)}
  .kpis{display:flex; gap:20px; margin-left:auto; flex-wrap:wrap}
  .kpi{display:flex; flex-direction:column}
  .kpi .lab{font-size:9px; letter-spacing:.11em; text-transform:uppercase; color:var(--txt-3); font-weight:600}
  .kpi .val{font-family:var(--mono); font-size:17px; font-weight:700; line-height:1.15}
  .kpi.hot .val{color:var(--accent-2)}
  .kpi.warn .val{color:var(--warn)}
  .live-dot{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block;
    animation:beat 1.8s ease-in-out infinite}
  .live-dot.off{background:var(--err); animation:none}
  @keyframes beat{0%,100%{opacity:1}50%{opacity:.25}}

  button{font-family:var(--mono); font-size:11px; font-weight:600; background:var(--surf-2);
    color:var(--txt-2); border:1px solid var(--line); border-radius:6px; padding:5px 11px;
    cursor:pointer; transition:.16s}
  button:hover{border-color:var(--accent); color:var(--txt)}
  button:focus-visible{outline:2px solid var(--accent-soft); outline-offset:2px}

  /* ── mapa de pulpos ── */
  .lienzo{position:relative}
  /* sin tarjetas debajo, el mapa se queda con la pantalla */
  #mapa{display:block; width:100%; height:calc(100vh - 168px); min-height:420px; transition:height .3s ease}
  #mapaPanel.enfocado #mapa{height:min(56vh, 600px)}
  #mapaPanel.plegado #mapa{height:0}
  #mapaPanel.plegado .lienzo{display:none}
  h2 .mini{font-size:9.5px; padding:2px 8px; margin-left:8px}
  .ficha{position:absolute; pointer-events:none; background:rgba(20,20,26,.97);
    border:1px solid var(--line); border-radius:8px; padding:8px 11px;
    font-family:var(--mono); font-size:11px; color:var(--txt-2); max-width:300px;
    opacity:0; transition:opacity .15s; box-shadow:0 8px 30px rgba(0,0,0,.6); z-index:5}
  .ficha b{color:var(--txt); font-family:var(--sans); font-size:12.5px}
  /* mapa del día */
  .dia-fila{display:flex; align-items:center; gap:10px; margin-bottom:7px}
  .dia-nombre{width:170px; flex:none; font-size:11.5px; font-weight:600; color:var(--txt-2);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .dia-tira{flex:1; display:flex; gap:1px; height:26px; align-items:flex-end}
  .dia-b{flex:1; background:var(--accent); border-radius:1px 1px 0 0; min-height:1px}
  .dia-tot{width:150px; flex:none; text-align:right; font-family:var(--mono);
    font-size:10px; color:var(--txt-3)}
  .dia-horas{display:flex; margin-left:180px; margin-right:158px; font-family:var(--mono);
    font-size:9px; color:var(--dim); border-top:1px solid var(--line-soft); padding-top:3px}
  .dia-horas span{flex:1; text-align:left}

  .barra-replay{display:flex; align-items:center; gap:9px; padding:9px 13px;
    border-top:1px solid var(--line-soft); background:var(--void-2)}
  .barra-replay .track{flex:1; height:5px; background:var(--surf-2); border:1px solid var(--line);
    border-radius:3px; position:relative; cursor:pointer}
  .barra-replay .fill{position:absolute; inset:0 auto 0 0; width:0%;
    background:linear-gradient(90deg,var(--accent),var(--accent-2)); border-radius:3px}
  .barra-replay .clock{font-family:var(--mono); font-size:11px; color:var(--txt-2); min-width:96px; text-align:right}
  .r-vel[aria-pressed="true"]{background:color-mix(in srgb,var(--accent) 22%,transparent); border-color:var(--accent); color:#fff}
  .ficha .l{color:var(--txt-3); font-size:9.5px; letter-spacing:.08em; text-transform:uppercase}

  /* ── ficha de la sesión abierta: lo que antes llevaba la tarjeta ── */
  .ficha-ses{display:flex; align-items:center; gap:22px; flex-wrap:wrap; padding:11px 14px}
  .ficha-ses .cleft{flex:1; min-width:280px}
  .ficha-ses .cstats{margin:0}

  /* ── flota ── */
  .fleet{display:grid; grid-template-columns:repeat(auto-fill,minmax(370px,1fr)); gap:12px}
  .card{background:var(--void-2); border:1px solid var(--line); border-radius:10px;
    padding:13px 15px; display:flex; flex-direction:column; gap:9px; cursor:pointer;
    text-align:left; transition:border-color .2s, transform .12s; color:inherit}
  .card:hover{border-color:var(--accent); transform:translateY(-1px)}
  .card.working{border-left:3px solid var(--ok)}
  .card.agents{border-left:3px solid var(--accent-soft)}
  .agents .cstate{color:var(--accent-soft); background:color-mix(in srgb,var(--accent) 16%,transparent)}
  .card.waiting{border-left:3px solid var(--warn)}
  .card.closed{border-left:3px solid var(--idle); opacity:.62}
  .crow{display:flex; align-items:center; gap:9px}
  .cproj{font-size:15px; font-weight:700; letter-spacing:-.01em}
  .cstate{margin-left:auto; font-family:var(--mono); font-size:9.5px; font-weight:700;
    letter-spacing:.07em; text-transform:uppercase; padding:2px 7px; border-radius:4px}
  .working .cstate{color:var(--ok); background:color-mix(in srgb,var(--ok) 14%,transparent)}
  .waiting .cstate{color:var(--warn); background:color-mix(in srgb,var(--warn) 14%,transparent)}
  .closed .cstate{color:var(--txt-3); background:var(--surf-2)}
  .cmeta{font-family:var(--mono); font-size:10px; color:var(--txt-3);
    display:flex; gap:10px; flex-wrap:wrap}
  .cleft{font-family:var(--mono); font-size:11px; color:var(--txt-2); background:var(--surf);
    border:1px solid var(--line-soft); border-radius:6px; padding:6px 9px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .cleft .l{color:var(--txt-3); font-size:9px; letter-spacing:.09em; text-transform:uppercase;
    display:block; margin-bottom:2px}
  .chips{display:flex; gap:5px; flex-wrap:wrap}
  .chip{display:flex; align-items:center; gap:5px; font-size:10.5px; font-family:var(--mono);
    background:var(--surf); border:1px solid var(--line-soft); border-radius:20px; padding:2px 9px 2px 6px; color:var(--txt-2)}
  .chip .d{width:6px;height:6px;border-radius:50%;background:var(--idle)}
  .chip.on .d{background:var(--ok); box-shadow:0 0 0 2.5px color-mix(in srgb,var(--ok) 22%,transparent)}
  .chip.off{opacity:.5}
  .cstats{display:flex; gap:16px; margin-top:1px}
  .cstat{display:flex; flex-direction:column}
  .cstat .l{font-size:8.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--txt-3); font-weight:600}
  .cstat .v{font-family:var(--mono); font-size:13px; font-weight:700}
  .cstat.lat .v{color:var(--accent-2)}
  .nada{padding:40px 20px; text-align:center; color:var(--txt-3); font-family:var(--mono); font-size:12px}

  /* ── detalle ── */
.vtabs{display:flex;gap:6px;margin-left:14px}
  .vtab{border:1px solid var(--line);background:var(--void);color:var(--txt-3);border-radius:6px;
    padding:3px 10px;font-family:var(--mono);font-size:10px;cursor:pointer;
    letter-spacing:.02em;text-transform:none;font-weight:500}
  .vtab.on{border-color:var(--accent);color:var(--txt);background:var(--surf)}
  .v-lede{color:var(--txt-2);font-size:11.5px;line-height:1.55;margin:0 0 10px;max-width:105ch}
  .v-lede b{color:var(--txt)}
  .v-ley{display:flex;gap:13px;flex-wrap:wrap;font-family:var(--mono);font-size:10px;
    color:var(--txt-3);margin-bottom:9px}
  .v-ley i{font-style:normal;display:inline-flex;align-items:center;gap:5px}
  .v-ley i::before{content:'';width:8px;height:8px;border-radius:2px;background:currentColor}
  #vistas svg{display:block;width:100%;height:auto;overflow:visible}
  #vistas .tm rect{stroke-width:1;transition:fill-opacity .15s}
  #vistas .tm:hover rect{fill-opacity:.62!important}
  #vistas .tm-t{fill:var(--txt);font-size:10.5px;font-weight:700;font-family:var(--mono);pointer-events:none}
  #vistas .tm-s{fill:var(--txt-3);font-size:9px;font-family:var(--mono);pointer-events:none}
  #vistas .mx-t{fill:var(--txt-3);font-size:9.5px;font-family:var(--mono)}
  .panel{background:var(--void-2); border:1px solid var(--line); border-radius:10px;
    display:flex; flex-direction:column; overflow:hidden}
  .panel > h2{margin:0; padding:8px 13px; font-size:9.5px; font-weight:700; letter-spacing:.15em;
    text-transform:uppercase; color:var(--txt-3); border-bottom:1px solid var(--line-soft);
    display:flex; align-items:center; gap:9px}
  .panel > h2 .note{font-weight:500; letter-spacing:.02em; text-transform:none;
    font-family:var(--mono); font-size:10px; color:var(--txt-3); margin-left:auto}
  .cols{display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:12px}
  .agent{background:var(--void-2); border:1px solid var(--line); border-radius:10px;
    display:flex; flex-direction:column; overflow:hidden; min-height:280px; transition:border-color .3s}
  .agent.live{border-color:color-mix(in srgb,var(--ok) 42%,var(--line))}
  .agent.think{border-color:color-mix(in srgb,var(--accent) 50%,var(--line))}
  .agent.lider{border-color:color-mix(in srgb,var(--accent) 55%,var(--line));
    background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 7%,var(--void-2)),var(--void-2))}
  .agent.lider .aname{color:var(--accent-soft)}
  .ahead{padding:10px 12px 9px; border-bottom:1px solid var(--line-soft)}
  .arow{display:flex; align-items:center; gap:8px}
  .aname{font-size:12.5px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .led{width:7px;height:7px;border-radius:50%;background:var(--idle);flex:none}
  .agent.live .led{background:var(--ok); box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 22%,transparent)}
  .agent.think .led{background:var(--accent-soft); box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 26%,transparent)}
  .astate{margin-left:auto; font-family:var(--mono); font-size:9.5px; font-weight:600;
    letter-spacing:.06em; text-transform:uppercase; color:var(--txt-3); flex:none}
  .agent.live .astate{color:var(--ok)} .agent.think .astate{color:var(--accent-soft)}
  .atype{font-family:var(--mono); font-size:9.5px; color:var(--txt-3); margin-top:3px}
  .now{margin-top:6px; font-family:var(--mono); font-size:11px; color:var(--txt-2);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-height:16px}
  .now b{color:var(--accent-soft); font-weight:600}
  .stream{flex:1; overflow:hidden; padding:7px 12px; display:flex; flex-direction:column; gap:4px}
  .ev{display:flex; gap:7px; font-family:var(--mono); font-size:10.5px; color:var(--txt-3)}
  .ev .t{color:var(--dim); flex:none} .ev .k{flex:none; font-weight:700}
  .ev .d{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .ev.msg .d{color:var(--txt-2)} .ev.lat .k,.ev.lat .d{color:#ff9ec9}
  .k.read{color:#6fb1ff} .k.bash{color:var(--ok)} .k.grep{color:var(--warn)}
  .k.edit{color:var(--accent-soft)} .k.send{color:var(--accent-2)} .k.other{color:var(--txt-3)}
  /* lo que el agente escribe: el `thinking` se guarda vacío en el transcript,
     así que esto es lo más cerca del razonamiento que hay */
  .ev.dice{font-family:var(--sans); font-size:11.5px; color:var(--txt-2); align-items:baseline}
  .ev.dice .d{white-space:normal; display:-webkit-box; -webkit-line-clamp:2;
    -webkit-box-orient:vertical; line-height:1.35}
  .k.say{color:var(--accent-soft)}
  .afoot{border-top:1px solid var(--line-soft); padding:7px 12px; display:flex; gap:14px}
  .met{display:flex; flex-direction:column}
  .met .l{font-size:8.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--txt-3); font-weight:600}
  .met .v{font-family:var(--mono); font-size:12px; font-weight:700}
  .morgue{display:flex; flex-wrap:wrap; gap:7px; padding:9px 13px}
  .tomb{display:flex; align-items:center; gap:7px; font-family:var(--mono); font-size:10.5px;
    background:var(--surf); border:1px solid var(--line-soft); border-radius:6px; padding:4px 10px; color:var(--txt-3)}
  .tomb .nm{color:var(--txt-2); font-weight:700; font-family:var(--sans); font-size:11.5px}
  .tomb .x{color:var(--idle)}
  .bottom{display:grid; grid-template-columns:1fr 1.2fr; gap:12px}
  /* Sin barra de scroll visible: el panel se mira de reojo y una barra clara sobre el
     fondo oscuro canta más que el contenido. El scroll sigue funcionando igual, con
     rueda, con trackpad y con teclado; solo se oculta el indicador. */
  *{scrollbar-width:none}
  *::-webkit-scrollbar{width:0; height:0}
  .list{overflow-y:auto; max-height:230px; padding:4px 0}

  /* Alertas desplegables: el triángulo nativo de <details> desentona con el resto del
     panel, así que se sustituye por un signo propio en el mismo tono que las notas. */
  .alerta > summary{list-style:none}
  .alerta > summary::-webkit-details-marker{display:none}
  .alerta > summary::before{content:'▸'; color:var(--txt-3); font-size:10px;
    width:10px; flex:none; transition:transform .12s}
  .alerta[open] > summary::before{transform:rotate(90deg)}
  .alerta > summary:hover{background:var(--surf-2)}
  .task{display:flex; align-items:center; gap:9px; padding:5px 13px; font-size:12px; border-left:2px solid transparent}
  .task .id{font-family:var(--mono); font-size:10px; color:var(--txt-3); width:18px; flex:none}
  .task .s{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--txt-2)}
  .task .own{margin-left:auto; flex:none; font-family:var(--mono); font-size:9.5px; padding:1px 6px;
    border-radius:3px; background:var(--surf-2); color:var(--txt-3)}
  .task.completed{border-left-color:color-mix(in srgb,var(--ok) 60%,transparent)}
  .task.completed .s{color:var(--txt-3); text-decoration:line-through; text-decoration-color:var(--idle)}
  .task.in_progress{border-left-color:var(--accent)}
  .task.blocked{border-left-color:var(--warn)}
  .msg{padding:6px 13px; display:flex; flex-direction:column; gap:2px}
  .msg .hd{display:flex; align-items:center; gap:7px; font-family:var(--mono); font-size:10px}
  .msg .hd .tm{color:var(--dim)} .msg .hd .fr{color:var(--accent-soft); font-weight:700}
  .msg .hd .ar{color:var(--txt-3)} .msg .hd .to{color:var(--txt-2); font-weight:700}
  .msg .hd .tag{margin-left:auto; font-size:8.5px; letter-spacing:.08em; text-transform:uppercase;
    padding:1px 6px; border-radius:3px; font-weight:700}
  .msg.up .hd .tag{background:color-mix(in srgb,var(--idle) 30%,transparent); color:var(--txt-3)}
  .msg.lat .hd .tag{background:color-mix(in srgb,var(--accent-2) 30%,transparent); color:#ff9ec9}
  .msg.lat{background:color-mix(in srgb,var(--accent-2) 8%,transparent); border-left:2px solid var(--accent-2)}
  .msg .bd{font-size:12px; color:var(--txt-2)}
  .empty{padding:16px 14px; font-family:var(--mono); font-size:11px; color:var(--txt-3); line-height:1.6}
  .empty b{color:var(--warn)}
  [hidden]{display:none !important}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important; transition-duration:.01ms !important}}
</style>
</head>
<body>
<div class="shell">
  <div class="bar">
    <div class="brand">
      <h1>Corvere War Room</h1>
      <div class="sub" id="sub">conectando…</div>
    </div>
    <div class="kpis" id="kpis"></div>
    <button id="back" type="button" hidden>← volver a la flota</button>
  </div>

  <section class="panel" id="mapaPanel">
    <h2>Mapa de la flota
      <span class="note" id="mapanote"></span>
      <button type="button" id="b-replay" class="mini" hidden>▶ reproducir</button>
      <button type="button" id="b-cerradas" class="mini" hidden></button>
      <button type="button" id="b-dia" class="mini">el día</button>
      <button type="button" id="b-soltar" class="mini">soltar clavados</button>
      <button type="button" id="b-plegar" class="mini">plegar</button>
    </h2>
    <div class="lienzo">
      <canvas id="mapa"></canvas>
      <div class="ficha" id="ficha"></div>
    </div>
    <div class="barra-replay" id="barraReplay" hidden>
      <button type="button" id="r-play">⏸</button>
      <button type="button" class="r-vel" data-v="1">×1</button>
      <button type="button" class="r-vel" data-v="4">×4</button>
      <button type="button" class="r-vel" data-v="20">×20</button>
      <div class="track" id="r-track"><div class="fill" id="r-fill"></div></div>
      <span class="clock tnum" id="r-clock">00:00</span>
      <button type="button" id="r-salir">salir del replay</button>
    </div>
  </section>

  <section class="panel" id="diaPanel" hidden>
    <h2>El día <span class="note" id="dianote"></span></h2>
    <div id="dia" style="padding:10px 14px 14px"></div>
  </section>

  <section class="panel" id="cerradasPanel" hidden>
    <h2>Cerradas hace poco <span class="note">siguen en disco: se pueden reproducir</span></h2>
    <div class="list" id="cerradas"></div>
  </section>

  <!--
    Grafo del código. Aparece SOLO si existe APPs/CORVERE_GRAPH/data/warroom.json.
    En una máquina sin grafo (el Windows de referencia) esta sección no se muestra nunca.
    Sirve para una pregunta concreta: ¿se está usando el grafo, o es otro Obsidian?
  -->
  <section class="panel" id="grafoPanel" hidden>
    <h2>Grafo del código <span class="note" id="grafonote"></span></h2>
    <div id="grafo" style="padding:10px 14px 14px"></div>
  </section>

  <!--
    Producción: las 6 instancias Supabase y las alertas que ya emite el centro de mando.
    Es un ESPEJO, no un centro de alertas: el pipeline de notificación sigue viviendo
    en el centro de mando y el usuario ya está suscrito a su canal. Aquí se ve de un vistazo
    lo que hay corriendo, y sobre todo cuánto espacio queda, que es lo que avisa con
    semanas de margen en vez de con horas. Este panel no actúa sobre nada.
  -->
  <section class="panel" id="prodPanel" hidden>
    <h2>Producción <span class="note" id="prodnote"></span></h2>
    <div id="prod" style="padding:10px 14px 14px"></div>
  </section>

  <!--
    Vistas del grafo. Llegan ya dibujadas desde APPs/CORVERE_GRAPH (SVG en el JSON), así
    que aquí no se reimplementa nada: si cambia el dibujo allí, cambia aquí solo.
    Igual que el panel de arriba, no aparece si no hay grafo en esta máquina.
  -->
  <section class="panel" id="vistasPanel" hidden>
    <h2>Mapa del código
      <span class="vtabs" id="vtabs">
        <button type="button" class="vtab on" data-v="treemap">dónde está el peso</button>
        <button type="button" class="vtab" data-v="matriz">quién depende de quién</button>
      </span>
      <span class="note" id="vistasnote"></span></h2>
    <div id="vistas" style="padding:10px 14px 16px"></div>
  </section>

  <div id="detail" hidden style="display:flex; flex-direction:column; gap:12px">
    <section class="panel">
      <h2 id="dtitle">sesión</h2>
      <div class="ficha-ses" id="fichaSes"></div>
    </section>
